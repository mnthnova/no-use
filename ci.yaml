    - |
      for branch in $(git branch -r | grep -v HEAD | sed 's|origin/||' | sort -u); do
        git checkout "$branch"
        git pull origin "$branch" || true
        source build_tag.env
        echo "Building Branch :- $branch"
        
        # 1. Prepare Source
        cp -r content/* docs/source/ || true
        
        # 2. Extract Strings and Create PO Files for EN and JA
        echo "Extracting strings and updating locales..."
        sphinx-build -v -b gettext -t $PRODUCT_TAG -t $FORM_FACTOR_TAG docs/source docs/_build/gettext
        sphinx-intl update -p docs/_build/gettext -d docs/source/locale -l en -l ja
        
        # 3. Translate the PO files
        python3 scripts/auto_translate.py
        
        # 4. BUILD 1: Original Mixed (No language flag)
        echo "Building Original Mixed Output..."
        sphinx-build -Q -b html -D version="$branch" -D release="$branch" -t $PRODUCT_TAG -t $FORM_FACTOR_TAG docs/source "public/$branch/mixed"
        sphinx-build -Q -b simplepdf -D version="$branch" -D release="$branch" -t $PRODUCT_TAG -t $FORM_FACTOR_TAG docs/source "latex/$branch/mixed"
        
        # 5. BUILD 2: Pure English
        echo "Building Pure English Output..."
        sphinx-build -Q -b html -D language=en -D version="$branch" -D release="$branch" -t $PRODUCT_TAG -t $FORM_FACTOR_TAG docs/source "public/$branch/en"
        sphinx-build -Q -b simplepdf -D language=en -D version="$branch" -D release="$branch" -t $PRODUCT_TAG -t $FORM_FACTOR_TAG docs/source "latex/$branch/en"
        
        # 6. BUILD 3: Pure Japanese
        echo "Building Pure Japanese Output..."
        sphinx-build -Q -b html -D language=ja -D version="$branch" -D release="$branch" -t $PRODUCT_TAG -t $FORM_FACTOR_TAG docs/source "public/$branch/ja"
        sphinx-build -Q -b simplepdf -D language=ja -D version="$branch" -D release="$branch" -t $PRODUCT_TAG -t $FORM_FACTOR_TAG docs/source "latex/$branch/ja"
        
        # 7. Organize PDFs
        mkdir -p public/$branch/pdf/
        cp latex/$branch/mixed/*.pdf public/$branch/pdf/mixed.pdf || true
        cp latex/$branch/en/*.pdf public/$branch/pdf/en.pdf || true
        cp latex/$branch/ja/*.pdf public/$branch/pdf/ja.pdf || true
      done

